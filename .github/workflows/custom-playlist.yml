name: Update personal playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [master]
    paths:
      - custom-settings.json
      - build_custom_playlist.py
      - .github/workflows/custom-playlist.yml

permissions:
  contents: write

concurrency:
  group: personal-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Turkey and Sweden playlist
        run: python build_custom_playlist.py
      - name: Save updated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom.m3u8
          if ! git diff --cached --quiet; then
            git commit -m 'Update personal TV playlist'
            git push
          fi
